<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasākumi - Voluntio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="events.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a class="logo" href="index.html" aria-label="Voluntio sākumlapa">Voluntio</a>
            <ul class="nav-links">
                <li><a href="index.html">Sākumlapa</a></li>
                <li><a href="pasakumi.html" class="active">Pasākumi</a></li>
                <li><a href="create-event.html">Izveidot pasākumu</a></li>
                <li><a href="pieteikties.html">Pieteikties</a></li>
                <li><a href="admin.html">Admin panelis</a></li>
            </ul>
            <div class="auth-buttons">
                <a href="login.html" class="btn-login">Pieteikties</a>
                <a href="register.html" class="btn-register">Reģistrēties</a>
            </div>
        </nav>
    </header>

    <main class="events-main">
        <section class="events-header">
            <h1>Visi pieejamie pasākumi</h1>
            <p>Atrast talkas, labdarības akcijas un skolas pasākumus, kuros nepieciešami brīvprātīgie.</p>
            <div class="filter-container">
                <input type="text" id="searchInput" placeholder="Meklēt pēc nosaukuma...">
                <select id="categoryFilter">
                    <option value="">Visas kategorijas</option>
                    <option value="talka">Talkas</option>
                    <option value="labdariba">Labdarība</option>
                    <option value="skola">Skolas pasākumi</option>
                    <option value="cits">Citi pasākumi</option>
                </select>
            </div>
        </section>

        <section class="events-grid-section">
            <div class="events-grid custom-events-grid" data-custom-events></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Pasākumu Plānotājs. Visas tiesības aizsargātas.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="site.js"></script>
</body>
</html>
