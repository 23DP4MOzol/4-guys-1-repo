<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pieteikšanās - Voluntio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">Voluntio</div>
            <ul class="nav-links">
                <li><a href="index.html">Sākumlapa</a></li>
                <li><a href="pasakumi.html">Pasākumi</a></li>
                <li><a href="pieteikties.html">Pieteikties</a></li>
                <li><a href="admin.html">Admin panelis</a></li>
            </ul>
            <div class="auth-buttons">
                <a href="login.html" class="btn-login">Pieteikties</a>
                <a href="register.html" class="btn-register">Reģistrēties</a>
            </div>
        </nav>
    </header>

    <main class="events-main">
        <section class="events-header">
            <h1>Pieteikšanās</h1>
            <p>Ielogojies, lai pārvaldītu savus pieteikumus.</p>
        </section>
        <section class="card simple-form-card">
            <form class="simple-form" action="#" method="post" data-login-form>
                <label for="email">E-pasts</label>
                <input id="email" name="email" type="email" placeholder="vards@example.com" required>

                <label for="password">Parole</label>
                <input id="password" name="password" type="password" placeholder="Ievadi paroli" required>

                <button class="btn-primary" type="submit">Pieteikties</button>
            </form>
            <p class="form-note" data-form-message></p>
            <p class="form-note">Vēl nav konta? <a href="register.html">Reģistrēties</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Voluntio. Visas tiesības aizsargātas.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="site.js"></script>
</body>
</html>
